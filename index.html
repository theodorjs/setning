        function makeWordSentence(id, pairs) {
            return {
                id,
                words: pairs.map(([text, cls], index) => ({
                    id: `${id}-w${index}`,
                    text,
                    cls
                }))
            };
        }

        function makeWordSentences(prefix, rows) {
            return rows.map((pairs, index) => makeWordSentence(`${prefix}-${index + 1}`, pairs));
        }

        function tagSentenceGroup(source, tags, groups) {
            return Object.entries(groups).flatMap(([difficulty, sentences]) =>
                sentences.map((sentence) => tagSentence(sentence, difficulty, tags, source))
            );
        }

        function tagSentence(sentence, difficulty, tags, source) {
            return {
                ...sentence,
                source,
                difficulty,
                tags: unique([...(sentence.tags || []), ...tags]),
                words: sentence.words.map((word, index) => ({
                    ...word,
                    id: word.id || `${sentence.id}-w${index}`
                }))
            };
        }

        function mergeDuplicateSentences(sentences) {
            const merged = new Map();
            sentences.forEach((sentence) => {
                const signature = sentenceSignature(sentence);
                const existing = merged.get(signature);
                if (!existing) {
                    merged.set(signature, {
                        ...sentence,
                        sources: [sentence.source]
                    });
                    return;
                }

                if (!sameSentenceWords(existing.words, sentence.words)) {
                    throw new Error(`Setningen ${sentence.id} har samme tekst som ${existing.id}, men ulik ordklassemerking.`);
                }
                existing.tags = unique([...existing.tags, ...sentence.tags]);
                existing.sources = unique([...existing.sources, sentence.source]);
                if (!existing.chunks && sentence.chunks) {
                    existing.chunks = sentence.chunks;
                }
            });
            return [...merged.values()];
        }

        function sentenceSignature(sentence) {
            return `${sentence.difficulty}:${sentence.words.map((word) => normalizeToken(word.text)).join(" ")}`;
        }

        function sameSentenceWords(a, b) {
            return a.length === b.length && a.every((word, index) => (
                normalizeToken(word.text) === normalizeToken(b[index].text) && word.cls === b[index].cls
            ));
        }

        function getSentencesByTag(tag) {
            return Object.fromEntries(DIFFICULTIES.map((difficulty) => [
                difficulty.id,
                SENTENCE_BANK.filter((sentence) => (
                    sentence.difficulty === difficulty.id && sentence.tags.includes(tag)
                ))
            ]));
        }

        function task(word, target, answer, options, explanation) {
            return { word, target, answer, options: unique(options), explanation };
        }

        function unique(items) {
            return [...new Set(items)];
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function classStyle(classId) {
            return `style="--class-color: ${WORD_CLASS_BY_ID[classId].color}"`;
        }

        function roleStyle(roleId) {
            return `style="--role-color: ${ROLE_BY_ID[roleId].color}"`;
        }

        function scoreLevel() {
            return Math.max(1, Math.floor(state.score / 12) + 1);
        }

        function difficultyInfo() {
            return DIFFICULTIES.find((item) => item.id === state.difficulty) || DIFFICULTIES[1];
        }

        function activityInfo() {
            return ACTIVITY_BY_ID[state.activity] || null;
        }

        function render() {
            document.querySelectorAll(".drag-ghost").forEach((ghost) => ghost.remove());
            sortDragActive = false;
            const active = document.activeElement;
            const focusedId = active && active.id && app.contains(active) ? active.id : null;
            const selection = focusedId && typeof active.selectionStart === "number"
                ? [active.selectionStart, active.selectionEnd]
                : null;
            const snakeBoard = app.querySelector("[data-snake-board]");
            // Husk hvor langt eleven har rullet – men bare fra et brett som faktisk er ferdig tegnet.
            if (snakeBoard && snakeBoard.dataset.ready && state.challenge) state.challenge.savedScroll = snakeBoard.scrollLeft;
            app.innerHTML = `
                <div class="app-shell ${state.view === "ordslangen" ? "app-shell-wide" : ""}">
                    ${renderTopbar()}
                    <main class="screen">
                        ${renderCurrentView()}
                    </main>
                </div>
            `;

            if (focusedId) {
                const element = document.getElementById(focusedId);
                if (element && !element.disabled) {
                    element.focus({ preventScroll: true });
                    if (selection && typeof element.setSelectionRange === "function") {
                        try {
                            element.setSelectionRange(selection[0], selection[1]);
                        } catch (error) {
                            // Feltet støtter ikke markering.
                        }
                    }
                }
            }

            if (state.view === "sort") {
                window.requestAnimationFrame(setupSortable);
            }

            if (state.view === "ordslangen") {
                window.requestAnimationFrame(afterSnakeRender);
            }
        }

        function renderTopbar() {
            const current = activityInfo();
            const hasDifficulty = current && current.id !== "learn";
            return `
                <header class="topbar">
                    ${state.view !== "home" ? `
                        <div class="topbar-left">
                            <button class="home-icon-button" data-action="home" aria-label="Til startsiden" title="Til startsiden">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M3 11.4 12 4l9 7.4"></path>
                                    <path d="M5.5 10.3V20h13v-9.7"></path>
                                    <path d="M9.5 20v-5h5v5"></path>
                                </svg>
                            </button>
                            ${hasDifficulty && state.view !== "difficulty" ? `<button class="secondary-button" data-action="difficulty">Nivå: ${difficultyInfo().label}</button>` : ""}
                        </div>
                    ` : ""}
                    <div class="toolbar">
                        <div class="scoreboard" aria-label="Poeng">
                            <span class="score-pill">Poeng: ${state.score}</span>
                            <span class="score-pill">Streak: ${state.streak}</span>
                            <span class="level-pill">Nivå ${scoreLevel()}</span>
                        </div>
                    </div>
                </header>
            `;
        }

        function renderCurrentView() {
            if (state.view === "difficulty") return renderDifficulty();
            if (state.view === "analysis") return renderAnalysis();
            if (state.view === "find") return renderFind();
            if (state.view === "sort") return renderSort();
            if (state.view === "inflect") return renderInflect();
            if (state.view === "quiz") return renderQuiz();
            if (state.view === "build") return renderBuild();
            if (state.view === "memory") return renderMemory();
            if (state.view === "learn") return renderLearn();
            if (state.view === "ordslangen") return renderSnake();
            return renderHome();
        }

        function renderHome() {
            return `
                <section class="home-stage">
                    <div class="home-title-block">

                    </div>
                </section>
                <div class="home-kicker-row">

                <section class="home-grid" aria-label="Aktiviteter">
                    ${ACTIVITIES.map((activity) => `

        function renderDifficulty() {
            const activity = activityInfo();
            return `
                <section class="work-panel">
                    <div class="panel-heading">

        function renderAnalysis() {
            const challenge = ensureChallenge("analysis");
            const answeredCount = Object.keys(challenge.answers).length;

            return `
                <section class="work-panel analysis-panel">
                    <div class="panel-heading">

                    <div class="analysis-workspace">
                        <div class="sentence-board analysis-word-board" aria-label="Setning">
                            ${challenge.sentence.analysisWords.map((word) => {
                                const answer = challenge.answers[word.id];
                                const role = ROLE_BY_ID[answer || word.role];
                                return `
                                    <button class="analysis-chunk analysis-word ${answer ? "answered" : ""} ${challenge.wrongId === word.id ? "wrong" : ""}" data-action="chunk" data-chunk="${word.id}" style="--role-color: ${role.color}">
                                        ${escapeHtml(word.text)}

                            }).join("")}

                        </div>
                        <div class="analysis-selected">Valgt kloss: <strong>${ROLE_BY_ID[state.selectedRole].label}</strong></div>
                        <div class="analysis-tools" aria-label="Setningsledd">
                            ${challenge.roleOptions.map((roleId) => {
                                const role = ROLE_BY_ID[roleId];
                                return `
                                    <div class="role-tool" style="--role-color: ${role.color}">
                                        <button class="role-button analysis-role-button ${state.selectedRole === role.id ? "active" : ""}" data-action="role" data-role="${role.id}">
                                            <span>${role.label}</span>
                                        </button>
                                        <button class="hint-button" data-action="role-hint" data-role="${role.id}" aria-label="Hint for ${role.label}">?</button>
                                    </div>
                                `;
                            }).join("")}
                        </div>
                    </div>
                    ${renderFeedback("", "analysis-feedback")}
                </section>

        }

        function renderFind() {
            const challenge = ensureChallenge("find");
            const classInfo = WORD_CLASS_BY_ID[challenge.targetClass];
            return `
                <section class="module-layout">
                    <aside class="side-panel">
                        <h2>Finn ordklassen</h2>

                            <strong>${classInfo.label}</strong>

                            </div>
                        </div>
                        <div class="sentence-board compact">
                            ${challenge.sentence.words.map((word) => {
                                const isCorrectClass = word.cls === challenge.targetClass;
                                const wasPicked = challenge.pickedId === word.id;
                                const classes = [
                                    "token-button",
                                    !challenge.done && !wasPicked ? "neutral" : "",
                                    challenge.done && isCorrectClass ? "revealed" : "",
                                    wasPicked && challenge.done ? "correct" : "",
                                    wasPicked && challenge.wrong ? "wrong" : ""
                                ].filter(Boolean).join(" ");
                                const colorStyle = challenge.done || wasPicked ? classStyle(word.cls) : "";
                                return `
                                    <button class="${classes}" data-action="find-word" data-word="${word.id}" ${colorStyle}>
                                        ${escapeHtml(word.text)}
                                    </button>
                                `;
                            }).join("")}
                            <span class="sentence-period">.</span>
                        </div>
                        ${renderFeedback()}
                    </section>
                </section>

            return `
                <section class="module-layout">
                    <aside class="side-panel">
                        <h2>Riktig rekkefølge</h2>
                        <p class="muted">${difficultyInfo().description}</p>
                        <button class="primary-button" data-action="check-sort">Sjekk</button>
                        <button class="secondary-button" data-action="next">Ny setning</button>

                    <section class="work-panel">

                        </div>
                        <div class="sort-board" data-sort-board="true">
                            ${challenge.words.map((word) => `
                                <button class="sort-token" data-sort-id="${word.sortId}" ${classStyle(word.cls)}>
                                    ${escapeHtml(word.text)}
                                </button>
                            `).join("")}
                            <span class="sentence-period">.</span>
                        </div>
                        ${renderFeedback()}
                        <div class="theory-card">
                            <h3>Ordklassene følger klossene</h3>
                            <div class="chip-list">
                                ${challenge.correctWords.map((word) => wordChip(word)).join("")}
                            </div>
                        </div>
                    </section>
                </section>
            `;
        }

        function renderInflect() {
            if (!INFLECTABLE_CLASSES.includes(state.selectedInflectClass)) {
                state.selectedInflectClass = "substantiv";
            }
            const challenge = ensureChallenge("inflect");
            const classInfo = WORD_CLASS_BY_ID[state.selectedInflectClass];
            const help = getInflectionHelp(state.selectedInflectClass, challenge.task.target);
            return `
                <section class="module-layout">
                    <aside class="side-panel">
                        <h2>Ordklasse</h2>
                        <div class="class-tabs">
                            ${INFLECTABLE_CLASSES.map((classId) => {
                                const item = WORD_CLASS_BY_ID[classId];
                                return `
                                    <button class="tab-button ${state.selectedInflectClass === classId ? "active" : ""}" data-action="inflect-class" data-class="${classId}" style="--active-color: ${item.color}">
                                        <span class="color-swatch" style="--class-color: ${item.color}"></span>
                                        <span>${item.label}</span>
                                    </button>
                                `;
                            }).join("")}
                        </div>
                        <p class="muted">${classInfo.description}</p>
                        <button class="secondary-button" data-action="next">Nytt ord</button>
                    </aside>
                    <section class="work-panel">
                        <div class="panel-heading">
                            <div>
                                <h2>Bøy ordet</h2>
                                <p>${difficultyInfo().description}</p>
                            </div>
                        </div>
                        <div class="inflect-card" style="--class-color: ${classInfo.color}">
                            <span class="class-pill" style="--class-color: ${classInfo.color}">${classInfo.label}</span>
                            <div class="inflect-word">${escapeHtml(challenge.task.word)}</div>
                            <div class="target-strip" style="--class-color: ${classInfo.color}">
                                <span class="color-swatch"></span>
                                <strong>${escapeHtml(challenge.task.target)}</strong>
                            </div>
                        </div>
                        <div class="option-grid">
                            ${challenge.task.options.map((option, index, options) => {
                                const selected = challenge.selected === option;
                                const classNames = [
                                    selected ? (challenge.correct ? "correct" : "wrong") : "",
                                    options.length % 2 === 1 && index === options.length - 1 ? "span-option" : ""
                                ].filter(Boolean).join(" ");
                                const className = classNames ? ` ${classNames}` : "";
                                return `<button class="option-button ${className}" data-action="inflect-answer" data-answer="${escapeHtml(option)}">${escapeHtml(option)}</button>`;
                            }).join("")}

                        ${renderFeedback()}
                        <div class="inflect-help-area" style="--class-color: ${classInfo.color}">
                            <button class="hint-button inflect-help-button" data-action="inflect-help" aria-label="Hjelp med ${escapeHtml(challenge.task.target)}" aria-expanded="${challenge.helpOpen ? "true" : "false"}">?</button>
                            ${challenge.helpOpen ? renderInflectionHelp(help) : ""}
                        </div>
                        ${challenge.correct ? `<button class="primary-button" data-action="next">Neste</button>` : ""}
                    </section>
                </section>
            `;
        }

        function renderInflectionHelp(help) {
            return `
                <div class="inflect-help-card">
                    <h3>${escapeHtml(help.title)}</h3>
                    <p>${escapeHtml(help.explanation)}</p>
                    <div class="inflect-example-list">
                        ${help.examples.map((example) => `<span>${escapeHtml(example)}</span>`).join("")}
                    </div>
                    ${help.forms ? `
                        <div class="inflect-form-table" aria-label="Bøyingsrekke">
                            ${help.forms.map((form) => `
                                <div class="inflect-form-cell">
                                    <span>${escapeHtml(form.label)}</span>
                                    <strong>${escapeHtml(form.value)}</strong>
                                </div>
                            `).join("")}
                        </div>
                    ` : ""}
                    ${help.note ? `<p class="inflect-help-note">${escapeHtml(help.note)}</p>` : ""}
                </div>
            `;
        }

        function getInflectionHelp(classId, target) {
            const classHelp = INFLECTION_HELP[classId] || {};
            return classHelp[target] || {
                title: target,
                explanation: "Se på hvilken form oppgaven ber om, og sammenlign med eksempelrekken for ordklassen.",
                examples: ["grunnform -> bøyd form"],
                note: ""
            };
        }

        function renderQuiz() {
            const challenge = ensureChallenge("quiz");
            return `
                <section class="work-panel">
                    <div class="panel-heading">
                        <div>
                            <h2>Velg riktig alternativ</h2>
                            <p>Hvilken ordklasse er det uthevede ordet?</p>

                                <span class="quiz-token ${isTarget ? "target" : ""} ${revealed ? "revealed" : ""}" ${revealed ? classStyle(word.cls) : ""}>

                            return `<button class="option-button ${resultClass}" data-action="quiz-answer" data-class="${classId}">${info.label}</button>`;

        function renderMemory() {

                <section class="work-panel">

        function renderLearn() {

            return `

                                <h3>Kjennetegn</h3>
                                <ul>
                                    ${item.facts.map((fact) => `<li>${escapeHtml(fact)}</li>`).join("")}
                                </ul>
                            </article>
                            <article class="theory-card">
                                <h3>Eksempler</h3>
                                <div class="chip-list">
                                    ${item.examples.map((example) => `
                                        <span class="word-chip" style="--class-color: ${item.color}">${escapeHtml(example)}</span>
                                    `).join("")}
                                </div>
                            </article>
                        </div>
                        <article class="theory-card">
                            <h3>I en setning</h3>
                            <div class="sample-sentence">
                                ${item.sample.map((word) => wordChip(word)).join("")}
                                <span class="sentence-period">.</span>
                            </div>
                        </article>
                        ${INFLECTABLE_CLASSES.includes(item.id) ? `
                            <button class="primary-button" data-action="practice-inflect" data-class="${item.id}">Bøy ${item.label.toLowerCase()}</button>
                        ` : `
                            <button class="primary-button" data-action="practice-find" data-class="${item.id}">Finn ${item.label.toLowerCase()}</button>
                        `}
                    </section>
                </section>
            `;
        }

        function renderFeedback(emptyText = "Velg en oppgave og bygg streaken videre.", extraClass = "") {
            if (!state.feedback) {
                if (!emptyText) return "";
                return `<div class="feedback info ${extraClass}">${escapeHtml(emptyText)}</div>`;
            }

            return `
                <div class="feedback ${state.feedback.type} ${extraClass}">
                    <strong>${escapeHtml(state.feedback.text)}</strong>
                    ${state.feedback.detail ? `<span>${escapeHtml(state.feedback.detail)}</span>` : ""}
                </div>
            `;
        }

        function wordChip(word) {
            const info = WORD_CLASS_BY_ID[word.cls];
            return `
                <span class="word-chip" style="--class-color: ${info.color}">
                    ${escapeHtml(word.text)}
                    <small>${info.label}</small>
                </span>
            `;
        }

        function sentenceFromWords(words) {
            return words.map((word) => word.text).join(" ");
        }

        function ensureChallenge(activity) {
            const key = challengeKey(activity);
            if (!state.challenge || state.challenge.key !== key) {
                state.challenge = createChallenge(activity, key);
            }
            return state.challenge;
        }

        function challengeKey(activity) {
            if (activity === "inflect") {
                return `${activity}:${state.difficulty}:${state.selectedInflectClass}`;
            }
            return `${activity}:${state.difficulty}`;
        }

        function createChallenge(activity, key) {
            if (activity === "ordslangen") {
                return createSnakeChallenge(key);
            }

            if (activity === "analysis") {
                const sentence = pickFrom(ANALYSIS_SENTENCES[state.difficulty], key);
                sentence.analysisWords = buildAnalysisWords(sentence);
                const roleOptions = getAnalysisRoleOptions(sentence.analysisWords);
                if (!roleOptions.includes(state.selectedRole)) {
                    state.selectedRole = roleOptions[0];
                }
                return { key, sentence, answers: {}, mistakes: {}, wrongId: null, done: false, roleOptions };
            }

            if (activity === "find") {
                const allowedTargets = FIND_TARGETS[state.difficulty];
                const sentences = WORD_SENTENCES[state.difficulty].filter((sentence) => {
                    const classes = new Set(sentence.words.map((word) => word.cls));
                    return allowedTargets.some((classId) => classes.has(classId));
                });
                const sentence = pickFrom(sentences, key);
                const availableTargets = allowedTargets.filter((classId) => sentence.words.some((word) => word.cls === classId));
                return {
                    key,
                    sentence,
                    targetClass: pickFrom(availableTargets, `${key}:target:${sentence.id}`),
                    pickedId: null,
                    done: false,
                    wrong: false,
                    hadMistake: false
                };
            }

            if (activity === "sort") {
                const sentence = pickFrom(SORT_SENTENCES[state.difficulty], key);
                const correctWords = sentence.words.map((word, index) => ({ ...word, sortId: `${word.id}-${index}` }));
                let shuffled = shuffle(correctWords);
                if (sameOrder(shuffled, correctWords) && shuffled.length > 1) {
                    shuffled = [shuffled[1], shuffled[0], ...shuffled.slice(2)];
                }
                return { key, correctWords, words: shuffled, done: false };
            }

            if (activity === "quiz") {
                const sentence = pickFrom(WORD_SENTENCES[state.difficulty], key);
                const candidates = sentence.words.filter((word) => FIND_TARGETS[state.difficulty].includes(word.cls));
                const pool = candidates.length ? candidates : sentence.words;
                const word = pool[Math.floor(Math.random() * pool.length)];
                const distractors = shuffle(WORD_CLASSES.map((item) => item.id).filter((id) => id !== word.cls)).slice(0, 3);
                return {
                    key,
                    sentence,
                    word,
                    options: shuffle([word.cls, ...distractors]),
                    selected: null,
                    correct: false,
                    done: false,
                    hadMistake: false
                };
            }

            if (activity === "build") {
                const entry = pickFrom(BUILD_WORDS[state.difficulty], key);
                let letters = shuffle([...entry.text]);
                if (letters.join("") === entry.text && letters.length > 1) {
                    letters.reverse();
                }
                return {
                    key,
                    word: entry.text,
                    cls: entry.cls,
                    letters: letters.map((ch) => ({ ch })),
                    picked: [],
                    done: false,
                    hadMistake: false,
                    wrongFlash: false
                };
            }

            if (activity === "memory") {
                return {
                    key,
                    cards: buildMemoryCards(state.difficulty),
                    flipped: [],
                    matched: [],
                    done: false
                };
            }

            const tasks = INFLECTION_TASKS[state.selectedInflectClass][state.difficulty];
            return {
                key,
                task: pickFrom(tasks, key),
                selected: null,
                correct: false,
                helpOpen: false,
                hadMistake: false
            };
        }

        function buildAnalysisWords(sentence) {
            const chunkTrackers = sentence.chunks.map((chunk) => {
                const totals = new Map();
                chunk.text.split(/\s+/).map(normalizeToken).forEach((token) => {
                    totals.set(token, (totals.get(token) || 0) + 1);
                });
                return { role: chunk.role, totals, used: new Map() };
            });

            return sentence.words.map((word, index) => {
                const token = normalizeToken(word.text);
                const tracker = chunkTrackers.find((chunk) => {
                    const used = chunk.used.get(token) || 0;
                    const total = chunk.totals.get(token) || 0;
                    return used < total;
                });

                if (tracker) {
                    tracker.used.set(token, (tracker.used.get(token) || 0) + 1);
                }

                return {
                    ...word,
                    id: word.id || `${sentence.id}-word-${index}`,
                    role: tracker ? tracker.role : "adverbial"
                };
            });
        }

        function normalizeToken(text) {
            return text.toLowerCase().replace(/[.,!?;:]/g, "");
        }

        function getAnalysisRoleOptions(words) {
            const present = FUNCTION_ROLES
                .map((role) => role.id)
                .filter((roleId) => words.some((word) => word.role === roleId));

            if (state.difficulty === "lett") {
                return present;
            }

            if (state.difficulty === "middels") {
                const extras = FUNCTION_ROLES
                    .map((role) => role.id)
                    .filter((roleId) => !present.includes(roleId))
                    .slice(0, 2);
                return [...present, ...extras];
            }

            return FUNCTION_ROLES.map((role) => role.id);
        }

        function pickFrom(items, bucket) {
            const itemIds = items.map(itemKey);
            const availableIds = new Set(itemIds);
            let bag = state.selectionBags[bucket] || [];
            bag = bag.filter((id) => availableIds.has(id));

            if (!bag.length) {
                bag = shuffle(itemIds);
                const lastId = state.lastIds[bucket];
                if (bag.length > 1 && bag[0] === lastId) {
                    const swapIndex = bag.findIndex((id) => id !== lastId);
                    [bag[0], bag[swapIndex]] = [bag[swapIndex], bag[0]];
                }
            }

            const pickedId = bag.shift();
            state.selectionBags[bucket] = bag;
            const picked = items.find((item) => itemKey(item) === pickedId) || items[0];
            state.lastIds[bucket] = pickedId;
            return JSON.parse(JSON.stringify(picked));
        }

        function itemKey(item) {
            if (item && typeof item === "object") {
                return item.id || item.word || JSON.stringify(item);
            }
            return item;
        }

        function shuffle(items) {
            const copy = [...items];
            for (let index = copy.length - 1; index > 0; index -= 1) {
                const swapIndex = Math.floor(Math.random() * (index + 1));
                [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
            }
            return copy;
        }

        function sameOrder(a, b) {
            return a.map((item) => item.text).join("|") === b.map((item) => item.text).join("|");
        }

        function award(pointsMultiplier = 1) {
            const points = difficultyInfo().points * pointsMultiplier;
            state.score += points;
            state.streak += 1;
            saveProgress();
            return points;
        }

        function miss() {
            state.streak = 0;
            saveProgress();
        }

        function setFeedback(text, type = "info", detail = "", timeout = 1800) {
            window.clearTimeout(feedbackTimer);
            state.feedback = { text, type, detail };
            if (timeout) {
                feedbackTimer = window.setTimeout(() => {
                    state.feedback = null;
                    if (!sortDragActive) render();
                }, timeout);
            }
        }

        function resetChallenge() {
            state.challenge = null;
            state.feedback = null;
            window.clearTimeout(feedbackTimer);
            window.clearTimeout(nextTimer);
            window.clearTimeout(wrongFlashTimer);
            window.clearTimeout(memoryFlipTimer);
            window.clearTimeout(buildResetTimer);
        }

        function scheduleNext(delay = 1300) {
            window.clearTimeout(nextTimer);
            nextTimer = window.setTimeout(() => {
                resetChallenge();
                render();
            }, delay);
        }

        function completeTaskCelebration() {
            state.completedTasks += 1;
            saveProgress();
            launchConfettiBursts(10);
            if (state.completedTasks % 10 === 0) {
                window.setTimeout(launchMilestoneFireworks, 900);
            }
        }

        function launchConfettiBursts(totalBursts = 10) {
            window.clearInterval(confettiBurstTimer);
            let burstCount = 0;
            const fire = () => {
                burstCount += 1;
                const remaining = (totalBursts - burstCount + 1) / totalBursts;
                const particleCount = Math.max(12, Math.round(54 * remaining));
                fireConfettiShower(randomInRange(0.10, 0.30), randomInRange(-0.16, 0.08), particleCount);
                fireConfettiShower(randomInRange(0.70, 0.90), randomInRange(-0.16, 0.08), particleCount);
                if (burstCount >= totalBursts) {
                    window.clearInterval(confettiBurstTimer);
                    confettiBurstTimer = null;
                }
            };
            fire();
            confettiBurstTimer = window.setInterval(fire, 250);
        }

        function fireConfettiShower(originXRatio, originYRatio, particleCount) {
            const originX = window.innerWidth * originXRatio;
            const originY = window.innerHeight * originYRatio;
            const colors = ["#ef4444", "#f97316", "#ffd83d", "#22c55e", "#18c9b0", "#38bdf8", "#2563eb", "#a855f7", "#ffffff"];
            for (let index = 0; index < particleCount; index += 1) {
                const speed = randomInRange(8, 27);
                const angle = randomInRange(0, Math.PI * 2);
                const life = randomInRange(74, 124);
                const size = randomInRange(6, 13);
                celebrationParticles.push({
                    type: "confetti",
                    x: originX,
                    y: originY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed * 0.62 - randomInRange(1.5, 5.5),
                    gravity: randomInRange(0.34, 0.54),
                    drag: randomInRange(0.978, 0.988),
                    life,
                    maxLife: life,
                    size,
                    width: size * randomInRange(0.72, 1.38),
                    height: size * randomInRange(0.36, 0.72),
                    shape: Math.random() > 0.18 ? "rect" : "circle",
                    rotation: randomInRange(0, Math.PI * 2),
                    spin: randomInRange(-0.34, 0.34),
                    tilt: randomInRange(0, Math.PI * 2),
                    tiltSpeed: randomInRange(0.12, 0.30),
                    wobble: randomInRange(0, Math.PI * 2),
                    wobbleSpeed: randomInRange(0.08, 0.22),
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
            runCelebrationAnimation();
        }

        function launchMilestoneFireworks() {
            const positions = [
                { x: 0.28, y: 0.34 },
                { x: 0.50, y: 0.24 },
                { x: 0.72, y: 0.34 }
            ];
            positions.forEach((position, index) => {
                window.setTimeout(() => {
                    fireFirework(window.innerWidth * position.x, window.innerHeight * position.y);
                }, index * 280);
            });
        }

        function fireFirework(x, y) {
            const colors = ["#ff2f6d", "#ffd83d", "#22c55e", "#18c9b0", "#38bdf8", "#a855f7", "#ffffff"];
            const count = 92;
            for (let index = 0; index < count; index += 1) {
                const angle = (Math.PI * 2 * index) / count;
                const speed = randomInRange(3.8, 9.6);
                celebrationParticles.push({
                    type: "spark",
                    x,
                    y,
                    vx: Math.cos(angle) * speed * randomInRange(0.72, 1.16),
                    vy: Math.sin(angle) * speed * randomInRange(0.72, 1.16),
                    gravity: 0.055,
                    drag: 0.975,
                    life: randomInRange(58, 92),
                    maxLife: 92,
                    size: randomInRange(1.8, 3.8),
                    color: colors[index % colors.length]
                });
            }

            for (let index = 0; index < 34; index += 1) {
                const angle = randomInRange(0, Math.PI * 2);
                const speed = randomInRange(1.5, 5.3);
                celebrationParticles.push({
                    type: "spark",
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    gravity: 0.035,
                    drag: 0.988,
                    life: randomInRange(32, 58),
                    maxLife: 58,
                    size: randomInRange(3.2, 6.5),
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
            runCelebrationAnimation();
        }

        function runCelebrationAnimation() {
            resizeCelebrationCanvas();
            if (celebrationAnimation) return;
            const frame = () => {
                celebrationContext.clearRect(0, 0, celebrationCanvas.width, celebrationCanvas.height);
                celebrationParticles = celebrationParticles.filter((particle) => {
                    particle.life -= 1;
                    particle.vx *= particle.drag;
                    particle.vy = particle.vy * particle.drag + particle.gravity;
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    if (particle.type === "confetti") {
                        particle.rotation += particle.spin;
                        particle.tilt += particle.tiltSpeed;
                        particle.wobble += particle.wobbleSpeed;
                        particle.x += Math.sin(particle.wobble) * 0.72;
                    }
                    drawCelebrationParticle(particle);
                    return particle.life > 0 && particle.y < window.innerHeight + 120;
                });

                if (celebrationParticles.length) {
                    celebrationAnimation = window.requestAnimationFrame(frame);
                } else {
                    celebrationAnimation = null;
                    celebrationContext.clearRect(0, 0, celebrationCanvas.width, celebrationCanvas.height);
                }
            };
            celebrationAnimation = window.requestAnimationFrame(frame);
        }

        function drawCelebrationParticle(particle) {
            const alpha = Math.max(0, particle.life / particle.maxLife);
            celebrationContext.save();
            celebrationContext.globalAlpha = alpha;
            celebrationContext.translate(particle.x, particle.y);

            if (particle.type === "confetti") {
                celebrationContext.rotate(particle.rotation);
                celebrationContext.fillStyle = particle.color;
                if (particle.shape === "circle") {
                    celebrationContext.beginPath();
                    celebrationContext.ellipse(0, 0, particle.size * 0.42, particle.size * 0.42, 0, 0, Math.PI * 2);
                    celebrationContext.fill();
                } else {
                    const tiltScale = Math.max(0.22, Math.abs(Math.cos(particle.tilt)));
                    celebrationContext.scale(tiltScale, 1);
                    celebrationContext.fillRect(-particle.width / 2, -particle.height / 2, particle.width, particle.height);
                    if (tiltScale > 0.48) {
                        celebrationContext.globalAlpha = alpha * 0.34;
                        celebrationContext.fillStyle = "#ffffff";
                        celebrationContext.fillRect(-particle.width / 2, -particle.height / 2, particle.width * 0.34, particle.height);
                    }
                }
            } else {
                celebrationContext.fillStyle = particle.color;
                celebrationContext.shadowColor = particle.color;
                celebrationContext.shadowBlur = 12;
                celebrationContext.beginPath();
                celebrationContext.arc(0, 0, particle.size, 0, Math.PI * 2);
                celebrationContext.fill();
            }
            celebrationContext.restore();
        }

        function resizeCelebrationCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const width = Math.floor(window.innerWidth * dpr);
            const height = Math.floor(window.innerHeight * dpr);
            if (celebrationCanvas.width !== width || celebrationCanvas.height !== height) {
                celebrationCanvas.width = width;
                celebrationCanvas.height = height;
                celebrationCanvas.style.width = `${window.innerWidth}px`;
                celebrationCanvas.style.height = `${window.innerHeight}px`;
                celebrationContext.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
        }

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function setupSortable() {
            const board = app.querySelector("[data-sort-board]");
            if (!board || !state.challenge || state.view !== "sort") return;
            const tokens = [...board.querySelectorAll(".sort-token")];
            let dragged = null;
            let ghost = null;

            tokens.forEach((token) => {
                token.addEventListener("pointerdown", (event) => {
                    if (state.challenge.done || dragged) return;
                    dragged = token;
                    sortDragActive = true;
                    token.setPointerCapture(event.pointerId);
                    token.classList.add("dragging");
                    ghost = token.cloneNode(true);
                    ghost.classList.add("drag-ghost");
                    ghost.style.width = `${token.offsetWidth}px`;
                    ghost.style.height = `${token.offsetHeight}px`;
                    document.body.appendChild(ghost);
                    moveGhost(event.clientX, event.clientY);
                });

                token.addEventListener("pointermove", (event) => {
                    if (dragged !== token || !ghost) return;
                    event.preventDefault();
                    moveGhost(event.clientX, event.clientY);
                    dragged.style.pointerEvents = "none";
                    const target = document.elementFromPoint(event.clientX, event.clientY);
                    dragged.style.pointerEvents = "";
                    const targetToken = target && target.closest ? target.closest(".sort-token") : null;
                    if (!targetToken || targetToken === dragged || !board.contains(targetToken)) return;
                    const rect = targetToken.getBoundingClientRect();
                    const before = event.clientY < rect.top + rect.height / 2 || event.clientX < rect.left + rect.width / 2;
                    board.insertBefore(dragged, before ? targetToken : targetToken.nextSibling);
                });

                token.addEventListener("pointerup", finishDrag);
                token.addEventListener("pointercancel", finishDrag);
                token.addEventListener("lostpointercapture", finishDrag);
            });

            function moveGhost(x, y) {
                if (!ghost) return;
                ghost.style.left = `${x}px`;
                ghost.style.top = `${y}px`;
            }

            function finishDrag(event) {
                if (!dragged || (event && event.target !== dragged)) return;
                if (event && event.pointerId !== undefined) {
                    try {
                        dragged.releasePointerCapture(event.pointerId);
                    } catch (error) {
                        // Pekeren var allerede sluppet.
                    }
                }
                dragged.classList.remove("dragging");
                if (ghost) ghost.remove();
                ghost = null;
                dragged = null;
                sortDragActive = false;
                syncSortOrderFromDom();
                checkSort(false);
            }
        }

        function syncSortOrderFromDom() {
            if (!state.challenge || state.view !== "sort") return;
            const ids = [...app.querySelectorAll(".sort-token")].map((token) => token.dataset.sortId);
            const lookup = new Map(state.challenge.words.concat(state.challenge.correctWords).map((word) => [word.sortId, word]));
            state.challenge.words = ids.map((id) => lookup.get(id)).filter(Boolean);
        }

        function checkSort(showMiss = true) {
            const challenge = state.challenge;
            if (!challenge || challenge.done) return;
            const isCorrect = sameOrder(challenge.words, challenge.correctWords);
            if (isCorrect) {
                challenge.done = true;
                const points = award(2);
                setFeedback("Riktig rekkefølge", "success", `+${points} poeng`, 0);
                completeTaskCelebration();
                render();
                scheduleNext(1500);
            } else if (showMiss) {
                miss();
                setFeedback("Ikke helt riktig ennå", "error", "Se etter hvem som gjør hva.", 1600);
                render();
            }
        }

        app.addEventListener("click", (event) => {
            const target = event.target.closest("[data-action]");
            if (!target) return;

            const action = target.dataset.action;

            if (action.startsWith("snake-")) {
                handleSnakeAction(action, target);
                return;
            }

            if (action === "home") {
                state.view = "home";
                state.activity = null;
                resetChallenge();
                render();
                return;
            }

            if (action === "activity") {
                const activity = target.dataset.activity;
                state.activity = activity;
                resetChallenge();
                if (activity === "learn") {
                    state.view = "learn";
                } else {
                    state.view = "difficulty";
                }
                render();
                return;
            }

            if (action === "difficulty") {
                state.view = "difficulty";
                resetChallenge();
                render();
                return;
            }

            if (action === "select-difficulty") {
                state.difficulty = target.dataset.difficulty;
                state.view = state.activity;
                resetChallenge();
                render();
                return;
            }

            if (action === "next") {
                const now = Date.now();
                const challengeDone = state.challenge && (state.challenge.done || state.challenge.correct);
                if (!challengeDone && now < nextCooldownUntil) {
                    setFeedback("Vent litt", "info", "Prøv oppgaven før du henter en ny.", 1400);
                    render();
                    return;
                }
                nextCooldownUntil = now + 2000;
                resetChallenge();
                render();
                return;
            }

            if (action === "role") {
                state.selectedRole = target.dataset.role;
                render();
                return;
            }

            if (action === "role-hint") {
                const role = ROLE_BY_ID[target.dataset.role];
                setFeedback(role.label, "info", role.description, 5200);
                render();
                return;
            }

            if (action === "chunk") {
                handleChunk(target.dataset.chunk);
                return;
            }

            if (action === "find-word") {
                handleFindWord(target.dataset.word);
                return;
            }

            if (action === "check-sort") {
                syncSortOrderFromDom();
                checkSort(true);
                return;
            }

            if (action === "inflect-class") {
                state.selectedInflectClass = target.dataset.class;
                resetChallenge();
                render();
                return;
            }

            if (action === "inflect-help") {
                const challenge = ensureChallenge("inflect");
                challenge.helpOpen = !challenge.helpOpen;
                render();
                return;
            }

            if (action === "inflect-answer") {
                handleInflectAnswer(target.dataset.answer);
                return;
            }

            if (action === "quiz-answer") {
                handleQuizAnswer(target.dataset.class);
                return;
            }

            if (action === "build-letter") {
                handleBuildLetter(Number(target.dataset.index));
                return;
            }

            if (action === "build-remove") {
                handleBuildRemove(Number(target.dataset.pos));
                return;
            }

            if (action === "build-clear") {
                handleBuildClear();
                return;
            }

            if (action === "memory-card") {
                handleMemoryCard(target.dataset.card);
                return;
            }

            if (action === "learn-class") {
                state.selectedLearnClass = target.dataset.class;
                resetChallenge();
                render();
                return;
            }

            if (action === "practice-inflect") {
                state.selectedInflectClass = target.dataset.class;
                state.activity = "inflect";
                state.view = "difficulty";
                resetChallenge();
                render();
                return;
            }

            if (action === "practice-find") {
                state.activity = "find";
                state.view = "difficulty";
                resetChallenge();
                render();
            }
        });

        function handleChunk(chunkId) {
            const challenge = ensureChallenge("analysis");
            if (challenge.answers[chunkId]) return;
            const word = challenge.sentence.analysisWords.find((item) => item.id === chunkId);
            if (!word) return;

            if (word.role === state.selectedRole) {
                challenge.answers[chunkId] = word.role;
                if (challenge.wrongId === chunkId) challenge.wrongId = null;
                const points = challenge.mistakes[chunkId] ? 0 : award();
                const done = Object.keys(challenge.answers).length === challenge.sentence.analysisWords.length;
                if (done) {
                    challenge.done = true;
                    const clean = Object.keys(challenge.mistakes).length === 0;
                    const bonus = clean ? difficultyInfo().points * 2 : 0;
                    state.score += bonus;
                    saveProgress();
                    const total = points + bonus;
                    setFeedback(
                        "Hele setningen er analysert",
                        "success",
                        total > 0 ? `+${total} poeng` : "Ingen poeng denne gangen – prøv uten feilklikk.",
                        0
                    );
                    completeTaskCelebration();
                    render();
                    scheduleNext(1500);
                } else if (points > 0) {
                    setFeedback("Riktig setningsledd", "success", `+${points} poeng`);
                    render();
                } else {
                    setFeedback("Riktig setningsledd", "success", "Ingen poeng – du prøvde feil på ordet først.");
                    render();
                }
            } else {
                challenge.wrongId = chunkId;
                challenge.mistakes[chunkId] = true;
                miss();
                const correctRole = ROLE_BY_ID[word.role].label;
                setFeedback("Prøv en annen kloss", "error", `${word.text} passer bedre som ${correctRole}.`);
                render();
                window.clearTimeout(wrongFlashTimer);
                wrongFlashTimer = window.setTimeout(() => {
                    if (state.challenge && state.challenge.wrongId === chunkId) {
                        state.challenge.wrongId = null;
                        render();
                    }
                }, 650);
            }
        }

        function handleFindWord(wordId) {
            const challenge = ensureChallenge("find");
            if (challenge.done) return;
            const word = challenge.sentence.words.find((item) => item.id === wordId);
            if (!word) return;
            challenge.pickedId = wordId;
            if (word.cls === challenge.targetClass) {
                challenge.done = true;
                challenge.wrong = false;
                const points = challenge.hadMistake ? 0 : award();
                setFeedback(
                    "Riktig ordklasse",
                    "success",
                    points > 0 ? `+${points} poeng` : "Riktig – men ingen poeng etter feilforsøk.",
                    0
                );
                completeTaskCelebration();
                render();
                scheduleNext(1300);
            } else {
                challenge.wrong = true;
                challenge.hadMistake = true;
                miss();
                setFeedback("Se på fargen og ordets jobb", "error", `${word.text} er ${WORD_CLASS_BY_ID[word.cls].label.toLowerCase()}.`);
                render();
                window.clearTimeout(wrongFlashTimer);
                wrongFlashTimer = window.setTimeout(() => {
                    if (state.challenge && state.challenge.pickedId === wordId && !state.challenge.done) {
                        state.challenge.pickedId = null;
                        state.challenge.wrong = false;
                        render();
                    }
                }, 850);
            }
        }

        function handleInflectAnswer(answer) {
            const challenge = ensureChallenge("inflect");
            if (challenge.correct) return;
            challenge.selected = answer;
            if (answer === challenge.task.answer) {
                challenge.correct = true;
                const points = challenge.hadMistake ? 0 : award();
                setFeedback(
                    "Riktig bøying",
                    "success",
                    points > 0 ? `${challenge.task.explanation} +${points} poeng` : `${challenge.task.explanation} Ingen poeng etter feilforsøk.`,
                    0
                );
                completeTaskCelebration();
                render();
            } else {
                challenge.hadMistake = true;
                miss();
                setFeedback("Ikke riktig form", "error", `Riktig svar er ${challenge.task.answer}.`);
                render();
            }
        }

        function handleQuizAnswer(classId) {
            const challenge = ensureChallenge("quiz");
            if (challenge.correct || !WORD_CLASS_BY_ID[classId]) return;
            challenge.selected = classId;
            if (classId === challenge.word.cls) {
                challenge.correct = true;
                challenge.done = true;
                const points = challenge.hadMistake ? 0 : award();
                const classLabel = WORD_CLASS_BY_ID[classId].label.toLowerCase();
                setFeedback(
                    "Riktig",
                    "success",
                    points > 0 ? `${challenge.word.text} er ${classLabel}. +${points} poeng` : `${challenge.word.text} er ${classLabel}. Ingen poeng etter feilforsøk.`,
                    0
                );
                completeTaskCelebration();
                render();
                scheduleNext(1600);
            } else {
                challenge.hadMistake = true;
                miss();
                setFeedback("Ikke riktig", "error", `${WORD_CLASS_BY_ID[classId].label} passer ikke her. Prøv igjen.`);
                render();
            }
        }

        function handleBuildLetter(index) {
            const challenge = ensureChallenge("build");
            if (challenge.done || challenge.picked.includes(index) || !challenge.letters[index]) return;
            window.clearTimeout(buildResetTimer);
            challenge.wrongFlash = false;
            challenge.picked.push(index);

            if (challenge.picked.length < challenge.letters.length) {
                render();
                return;
            }

            const attempt = challenge.picked.map((letterIndex) => challenge.letters[letterIndex].ch).join("");
            if (attempt === challenge.word) {
                challenge.done = true;
                const points = challenge.hadMistake ? 0 : award(2);
                setFeedback(
                    "Riktig ord",
                    "success",
                    points > 0 ? `Du bygde ${challenge.word}. +${points} poeng` : `Du bygde ${challenge.word}. Ingen poeng etter feilforsøk.`,
                    0
                );
                completeTaskCelebration();
                render();
                scheduleNext(1500);
                return;
            }

            challenge.hadMistake = true;
            challenge.wrongFlash = true;
            miss();
            setFeedback("Ikke riktig ennå", "error", "Prøv en annen rekkefølge.");
            render();
            buildResetTimer = window.setTimeout(() => {
                if (state.challenge && state.challenge.key === challenge.key && !state.challenge.done) {
                    state.challenge.picked = [];
                    state.challenge.wrongFlash = false;
                    render();
                }
            }, 950);
        }

        function handleBuildRemove(position) {
            const challenge = ensureChallenge("build");
            if (challenge.done || position >= challenge.picked.length) return;
            window.clearTimeout(buildResetTimer);
            challenge.wrongFlash = false;
            challenge.picked.splice(position, 1);
            render();
        }

        function handleBuildClear() {
            const challenge = ensureChallenge("build");
            if (challenge.done || !challenge.picked.length) return;
            window.clearTimeout(buildResetTimer);
            challenge.wrongFlash = false;
            challenge.picked = [];
            render();
        }

        function handleMemoryCard(cardId) {
            const challenge = ensureChallenge("memory");
            if (challenge.done || challenge.flipped.length >= 2) return;
            const card = challenge.cards.find((item) => item.id === cardId);
            if (!card || challenge.matched.includes(card.pairId) || challenge.flipped.includes(cardId)) return;

            challenge.flipped.push(cardId);
            if (challenge.flipped.length < 2) {
                render();
                return;
            }

            const first = challenge.cards.find((item) => item.id === challenge.flipped[0]);
            if (first.pairId === card.pairId) {
                challenge.matched.push(card.pairId);
                challenge.flipped = [];
                if (challenge.matched.length * 2 === challenge.cards.length) {
                    challenge.done = true;
                    const points = award(3);
                    setFeedback("Alle par funnet", "success", `+${points} poeng`, 0);
                    completeTaskCelebration();
                    render();
                    scheduleNext(1800);
                    return;
                }
                setFeedback("Et par!", "success", `${first.text} og ${card.text} hører sammen.`);
                render();
            } else {
                render();
                window.clearTimeout(memoryFlipTimer);
                memoryFlipTimer = window.setTimeout(() => {
                    if (state.challenge && state.challenge.key === challenge.key) {
                        state.challenge.flipped = [];
                        render();
                    }
                }, 900);
            }
        }

        /* ================================================================== */
        /* Ordslangen                                                          */
        /* ================================================================== */

        const SNAKE_STORAGE_KEY = "setningsverksted-ordslangen-v1";

        // Startord. «a|b» viser leddene, «>grunnform» gir grunnformen av et bøyd sisteledd.
        // Alle er kontrollert mot Bokmålsordboka slik at det finnes mange ord å fortsette med.
        const SNAKE_START_WORDS = {
            lett: [
                "vann|flaske", "fot|ball", "skole|sekk", "snø|mann", "is|bjørn", "eple|tre", "leke|plass",
                "sjokolade|kake", "bok|hylle", "hunde|hus", "kjøkken|bord", "jule|tre", "post|kasse",
                "skole|buss", "gull|fisk", "brann|bil", "sol|krem", "snø|ball", "panne|kake",
                "blomster|potte", "fotball|sko", "bade|bukse", "tegne|bok"
            ],
            middels: [
                "stol|beina>bein", "hunde|valpen>valp", "fotball|banen>bane", "skole|bøkene>bok",
                "vann|flaskene>flaske", "kjøkken|stolen>stol", "snø|ballene>ball", "bok|hyllene>hylle",
                "post|kassa>kasse", "eple|trærne>tre", "jule|trærne>tre", "sykkel|hjulet>hjul",
                "skole|veien>vei", "sommer|ferien>ferie", "fotball|kampen>kamp"
            ],
            vanskelig: [
                "teppe", "sommer", "vinter", "lampe", "pute", "tomat", "sofa", "kaffe", "pepper",
                "eple", "radio", "pinne", "hylle", "tavle"
            ]
        };

        function snakeVariant() {
            return state.difficulty === "vanskelig" ? "syllable" : "compound";
        }

        function snakeVariantKey(challenge) {
            if (snakeVariant() === "syllable") {
                return `vanskelig-${challenge && challenge.strict ? "streng" : "vanlig"}`;
            }
            return state.difficulty;
        }

        function loadSnakeStore() {
            try {
                const saved = JSON.parse(window.localStorage.getItem(SNAKE_STORAGE_KEY));
                if (saved && typeof saved === "object") {
                    return {
                        chains: saved.chains && typeof saved.chains === "object" ? saved.chains : {},
                        records: saved.records && typeof saved.records === "object" ? saved.records : {},
                        strict: Boolean(saved.strict)
                    };
                }
            } catch (error) {
                // Lagret slange kunne ikke leses – start på nytt.
            }
            return { chains: {}, records: {}, strict: false };
        }

        function saveSnakeStore(store) {
            try {
                window.localStorage.setItem(SNAKE_STORAGE_KEY, JSON.stringify(store));
            } catch (error) {
                // Lagring utilgjengelig (f.eks. privat modus) – spill videre uten.
            }
        }

        function savedClassChain(challenge) {
            const chain = loadSnakeStore().chains[snakeVariantKey(challenge)];
            return chain && Array.isArray(chain.entries) && chain.entries.length ? chain : null;
        }

        function saveClassChain(challenge) {
            const store = loadSnakeStore();
            store.chains[snakeVariantKey(challenge)] = { entries: challenge.entries, updatedAt: Date.now() };
            saveSnakeStore(store);
        }

        function clearClassChain(challenge) {
            const store = loadSnakeStore();
            delete store.chains[snakeVariantKey(challenge)];
            saveSnakeStore(store);
        }

        function snakeRecord(challenge) {
            return Number(loadSnakeStore().records[snakeVariantKey(challenge)]) || 0;
        }

        function updateSnakeRecord(challenge) {
            const store = loadSnakeStore();
            const key = snakeVariantKey(challenge);
            const length = challenge.entries.length;
            const previous = Number(store.records[key]) || 0;
            if (length > previous) {
                store.records[key] = length;
                saveSnakeStore(store);
                return previous > 0;
            }
            return false;
        }

        function createSnakeChallenge(key) {
            return {
                key,
                phase: "setup",
                mode: null,
                strict: loadSnakeStore().strict,
                entries: [],
                input: "",
                checking: false,
                appThinking: false,
                messages: [],
                hint: { step: 0, result: null, loading: false, promise: null },
                newRecord: false,
                confirmNew: false
            };
        }

        function makeStartEntry(challenge) {
            const spec = pickFrom(SNAKE_START_WORDS[state.difficulty], `ordslangen-start:${state.difficulty}`);
            if (snakeVariant() === "syllable") {
                return {
                    word: spec,
                    lemma: spec,
                    parts: Ordslangen.syllabify(spec),
                    next: Ordslangen.syllableNext(spec, challenge.strict),
                    by: "start",
                    linkIn: 0
                };
            }
            const [partText, base] = spec.split(">");
            const parts = partText.split("|");
            const last = parts[parts.length - 1];
            return {
                word: parts.join(""),
                lemma: parts.join(""),
                parts,
                next: Ordslangen.compoundNext(last, base || last),
                by: "start",
                linkIn: 0
            };
        }

        function snakeNeed(challenge) {
            const last = challenge.entries[challenge.entries.length - 1];
            return last ? last.next : { forms: [], label: "" };
        }

        function snakeUsed(challenge) {
            const used = new Set();
            challenge.entries.forEach((entry) => {
                used.add(entry.word);
                if (entry.lemma) used.add(entry.lemma);
            });
            return used;
        }

        function matchedLength(word, forms) {
            const match = [...forms].sort((a, b) => b.length - a.length).find((form) => word.startsWith(form));
            return match ? match.length : 0;
        }

        // Hvor mye av starten som henger sammen med forrige ord. I sammensatte ord markeres ikke mer enn førsteleddet.
        function linkInLength(word, forms, parts) {
            const firstPart = (parts && parts[0]) || word;
            const fitting = forms.filter((form) => word.startsWith(form) && form.length <= firstPart.length);
            return fitting.length ? matchedLength(word, fitting) : matchedLength(word, forms);
        }

        function addSnakeEntry(challenge, result, by) {
            const need = snakeNeed(challenge);
            challenge.entries.push({
                word: result.word,
                lemma: result.lemma || result.word,
                parts: result.parts,
                next: result.next,
                by,
                linkIn: snakeVariant() === "compound"
                    ? linkInLength(result.word, need.forms, result.parts)
                    : matchedLength(result.word, need.forms),
                unchecked: Boolean(result.unchecked),
                combined: result.inDictionary === false && !result.unchecked,
                definition: result.definition || ""
            });
            challenge.justAdded = challenge.entries.length - 1;
        }

        function setSnakeMessages(challenge, ...messages) {
            challenge.messages = messages.filter(Boolean);
        }

        function startSnake(challenge, mode, continueSaved) {
            challenge.round = (challenge.round || 0) + 1;
            challenge.checking = false;
            challenge.appThinking = false;
            challenge.mode = mode;
            challenge.recordAtStart = snakeRecord(challenge);
            challenge.phase = "play";
            challenge.input = "";
            challenge.newRecord = false;
            challenge.confirmNew = false;
            challenge.prefixChoice = null;
            challenge.savedScroll = undefined;
            challenge.scrollToHead = true;
            resetSnakeHint(challenge);
            const saved = mode === "class" && continueSaved ? savedClassChain(challenge) : null;
            challenge.entries = saved ? saved.entries : [makeStartEntry(challenge)];
            if (mode === "class") {
                saveClassChain(challenge);
                setSnakeMessages(challenge, saved
                    ? { type: "info", text: `Velkommen tilbake! Fortsett med ${snakeNeed(challenge).label}` }
                    : { type: "info", text: `Startordet er «${challenge.entries[0].word}».`, detail: "Skriv resten av neste ord rett i hodet på slangen." });
            } else {
                setSnakeMessages(challenge, {
                    type: "info",
                    text: `Slangen starter med «${challenge.entries[0].word}». Din tur!`,
                    detail: "Starten på ordet står allerede i hodet på slangen. Skriv resten."
                });
                prefetchSnakeHint(challenge);
            }
            render();
        }

        function resetSnakeHint(challenge) {
            challenge.hint = { step: 0, result: null, loading: false, promise: null };
        }

        function snakeFindOptions(challenge, extra = {}) {
            return {
                variant: snakeVariant(),
                needForms: snakeNeed(challenge).forms,
                used: snakeUsed(challenge),
                strict: challenge.strict,
                easy: state.difficulty === "lett",
                ...extra
            };
        }

        function prefetchSnakeHint(challenge) {
            resetSnakeHint(challenge);
            const hint = challenge.hint;
            hint.promise = Ordslangen.findWord(snakeFindOptions(challenge, { requireFertile: false }))
                .then((result) => {
                    hint.result = result;
                    return result;
                })
                .catch(() => {
                    hint.offline = true;
                    return null;
                });
        }

        // Ordet ligger som mat foran munnen, slangen spiser det, og ordet blir en ny del av kroppen.
        async function feedSnake(challenge, result, by) {
            const round = challenge.round;
            challenge.feeding = { word: result.word, by };
            render();
            await new Promise((resolve) => window.setTimeout(resolve, 480));
            if (state.challenge !== challenge || challenge.round !== round) return false;
            challenge.feeding = null;
            challenge.foodFresh = true;
            addSnakeEntry(challenge, result, by);
            return true;
        }

        async function submitSnakeWord() {
            const challenge = state.challenge;
            if (!challenge || challenge.phase !== "play" || challenge.checking || challenge.appThinking || challenge.feeding) return;
            const input = document.getElementById("snake-input");
            if (input) challenge.input = input.value;
            if (!String(challenge.input || "").trim()) {
                challenge.shake = true;
                setSnakeMessages(challenge, { type: "info", text: `Skriv resten av ordet etter «${snakePrefix(challenge)}».` });
                render();
                return;
            }
            const raw = snakeTypedWord(challenge);
            const need = snakeNeed(challenge);
            const used = snakeUsed(challenge);
            const round = challenge.round;

            challenge.checking = true;
            render();

            let result;
            try {
                result = snakeVariant() === "syllable"
                    ? await Ordslangen.checkSyllableWord(raw, need.forms, used, challenge.strict)
                    : await Ordslangen.checkCompoundWord(raw, need.forms, used);
            } catch (error) {
                result = { ok: false, error: "Noe gikk galt under sjekken.", detail: "Prøv igjen." };
            }
            if (state.challenge !== challenge || challenge.round !== round) return;
            challenge.checking = false;

            if (!result.ok) {
                if (challenge.mode === "solo") miss();
                challenge.shake = true;
                setSnakeMessages(challenge, { type: "error", text: result.error, detail: result.detail || "" });
                render();
                return;
            }

            const fullHint = challenge.mode === "solo" && challenge.hint.step >= 3;
            challenge.input = "";
            if (!(await feedSnake(challenge, result, "elev"))) return;
            challenge.prefixChoice = null;
            const points = fullHint ? 0 : award();
            if (points > 0) completeTaskCelebration();

            const details = [];
            if (result.unchecked) details.push("Ordboka svarte ikke, så ordet ble ikke sjekket.");
            if (result.note) details.push(result.note);
            (result.warnings || []).forEach((warning) => details.push(`Tips: ${warning}`));
            details.push(points > 0 ? `+${points} poeng` : "Ingen poeng når du har fått hele ordet som hint.");
            const studentMessage = {
                type: result.unchecked ? "info" : "success",
                text: `«${result.word}» passer!`,
                detail: details.join(" ")
            };

            if (challenge.mode === "class") {
                saveClassChain(challenge);
                setSnakeMessages(challenge, studentMessage);
                render();
                return;
            }

            updateSnakeRecord(challenge);
            setSnakeMessages(challenge, studentMessage);
            await snakeMove(challenge);
        }

        async function snakeMove(challenge) {
            const round = challenge.round;
            challenge.appThinking = true;
            resetSnakeHint(challenge);
            render();
            const started = Date.now();
            let result = null;
            let offline = false;
            try {
                result = await Ordslangen.findWord(snakeFindOptions(challenge));
            } catch (error) {
                offline = true;
            }
            const elapsed = Date.now() - started;
            if (elapsed < 900) await new Promise((resolve) => window.setTimeout(resolve, 900 - elapsed));
            if (state.challenge !== challenge || challenge.round !== round || challenge.phase !== "play") return;
            challenge.appThinking = false;

            if (offline) {
                setSnakeMessages(challenge, challenge.messages[0], {
                    type: "info",
                    text: "Slangen får ikke kontakt med ordboka.",
                    detail: "Du får en ekstra tur – fortsett fra ditt eget ord."
                });
                render();
                return;
            }

            if (!result) {
                challenge.phase = "won";
                challenge.scrollToHead = true;
                updateSnakeRecord(challenge);
                challenge.newRecord = challenge.recordAtStart > 0 && challenge.entries.length > challenge.recordAtStart;
                setSnakeMessages(challenge);
                launchMilestoneFireworks();
                render();
                return;
            }

            if (!(await feedSnake(challenge, result, "slange"))) return;
            updateSnakeRecord(challenge);
            setSnakeMessages(challenge, challenge.messages[0], {
                type: "info",
                text: `Slangen svarte «${result.word}».`,
                detail: result.definition ? `Betyr: ${result.definition}` : ""
            });
            prefetchSnakeHint(challenge);
            render();
        }

        async function showSnakeHint(challenge) {
            const hint = challenge.hint;
            if (hint.step >= 3 || hint.loading) return;
            if (!hint.promise) prefetchSnakeHint(challenge);
            const currentHint = challenge.hint;
            currentHint.loading = true;
            render();
            const result = await currentHint.promise;
            if (state.challenge !== challenge || challenge.hint !== currentHint) return;
            currentHint.loading = false;

            if (!result) {
                setSnakeMessages(challenge, currentHint.offline
                    ? { type: "info", text: "Slangen får ikke kontakt med ordboka.", detail: "Prøv igjen litt senere." }
                    : { type: "info", text: "Dette er skikkelig vanskelig!", detail: "Slangen finner heller ikke noe ord. Trykk «Ny slange» for å starte på nytt." });
                render();
                return;
            }

            currentHint.step += 1;
            const need = snakeNeed(challenge);
            const start = matchedLength(result.word, need.forms);
            const syllableMode = snakeVariant() === "syllable";
            let message;
            if (currentHint.step === 1) {
                const first = need.forms[need.forms.length - 1];
                message = syllableMode
                    ? { type: "info", text: `Hint 1: Si «${need.forms[0]}» høyt, og prøv forskjellige fortsettelser.`, detail: `Det finnes et ord på ${result.word.length} bokstaver som passer.` }
                    : { type: "info", text: `Hint 1: Si «${first}» og prøv å sette et annet ord etter.`, detail: `Det finnes et ord på ${result.word.length} bokstaver som passer.` };
            } else if (currentHint.step === 2) {
                const shown = result.word.slice(0, Math.min(result.word.length - 1, start + 2));
