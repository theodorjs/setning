                message = { type: "info", text: `Hint 2: Ordet begynner på «${shown}…».`, detail: `Det har ${result.word.length} bokstaver.` };
            } else {
                message = {
                    type: "info",
                    text: `Hint 3: Prøv «${result.word}».`,
                    detail: `${result.definition ? `Det betyr: ${result.definition}. ` : ""}Du får ikke poeng for dette ordet.`
                };
            }
            setSnakeMessages(challenge, message);
            render();
        }

        function handleSnakeAction(action, target) {
            const challenge = state.challenge;
            if (!challenge || state.view !== "ordslangen") return;

            if (action === "snake-rule") {
                challenge.strict = target.dataset.rule === "streng";
                const store = loadSnakeStore();
                store.strict = challenge.strict;
                saveSnakeStore(store);
                render();
                return;
            }

            if (action === "snake-start") {
                startSnake(challenge, target.dataset.mode, target.dataset.continue === "1");
                return;
            }

            if (action !== "snake-new") challenge.confirmNew = false;

            if (action === "snake-setup") {
                challenge.round = (challenge.round || 0) + 1;
                challenge.phase = "setup";
                challenge.checking = false;
                challenge.appThinking = false;
                challenge.confirmNew = false;
                render();
                return;
            }

            if (action === "snake-new") {
                if (challenge.mode === "class" && challenge.entries.length > 1 && !challenge.confirmNew) {
                    challenge.confirmNew = true;
                    render();
                    return;
                }
                if (challenge.mode === "class") clearClassChain(challenge);
                startSnake(challenge, challenge.mode, false);
                return;
            }

            if (action === "snake-pause") {
                saveClassChain(challenge);
                challenge.phase = "pause";
                render();
                return;
            }

            if (action === "snake-resume") {
                challenge.phase = "play";
                challenge.scrollToHead = true;
                setSnakeMessages(challenge, { type: "info", text: `Fortsett med ${snakeNeed(challenge).label}` });
                render();
                return;
            }

            if (action === "snake-undo") {
                if (challenge.checking || challenge.entries.length <= 1) return;
                const removed = challenge.entries.pop();
                challenge.prefixChoice = null;
                challenge.scrollToHead = true;
                saveClassChain(challenge);
                setSnakeMessages(challenge, { type: "info", text: `«${removed.word}» er fjernet.`, detail: `Neste ord må begynne med ${snakeNeed(challenge).label}` });
                render();
                return;
            }

            if (action === "snake-help") {
                if (challenge.mode === "solo" && challenge.phase === "play" && !challenge.appThinking && !challenge.checking) {
                    showSnakeHint(challenge);
                }
                return;
            }

            if (action === "snake-prefix") {
                challenge.prefixChoice = target.dataset.prefix;
                challenge.scrollToHead = true;
                render();
                return;
            }

            if (action === "snake-seg") {
                const entry = challenge.entries[Number(target.dataset.index)];
                if (!entry) return;
                const joiner = snakeVariant() === "syllable" ? "-" : " + ";
                let detail = "";
                if (entry.definition) detail = `Betyr: ${entry.definition}`;
                else if (entry.unchecked) detail = "Ordet ble ikke sjekket i ordboka.";
                else if (entry.combined) detail = "Står ikke i ordboka, men er satt sammen av ekte ord.";
                setSnakeMessages(challenge, { type: "info", text: `${entry.word}: ${entry.parts.join(joiner)}`, detail });
                render();
            }
        }

        app.addEventListener("submit", (event) => {
            if (!event.target.matches("[data-snake-form]")) return;
            event.preventDefault();
            submitSnakeWord();
        });

        app.addEventListener("input", (event) => {
            if (event.target.id === "snake-input" && state.challenge) {
                state.challenge.input = event.target.value;
                event.target.style.width = snakeInputWidth(event.target.value);
                layoutSnake();
                const board = app.querySelector("[data-snake-board]");
                if (board) snakeScrollToHead(board, false);
            }
        });

        function snakeVariantLabel(challenge) {
            if (snakeVariant() === "syllable") {
                return `Stavelser · ${challenge.strict ? "streng" : "vanlig"} regel`;
            }
            return "Sammensatte ord";
        }

        function renderSnake() {
            const challenge = ensureChallenge("ordslangen");
            if (challenge.phase === "setup") return renderSnakeSetup(challenge);
            if (challenge.phase === "pause") return renderSnakePause(challenge);
            return renderSnakePlay(challenge);
        }

        function renderSnakeRules(challenge) {
            if (snakeVariant() === "syllable") {
                return `
                    <ul class="snake-rules">
                        <li>Ordet må ha minst to stavelser og <strong>ikke</strong> være sammensatt.</li>
                        <li>${challenge.strict
                            ? "Første stavelse må være helt lik siste stavelse i ordet før: pe-dal etter tep-<b>pe</b>."
                            : "Neste ord begynner med bokstavene i siste stavelse: <b>pe</b>pper etter tep-<b>pe</b>."}</li>
                        <li>Ordet må stå i ordboka. Egennavn er ikke lov, og hvert ord kan bare brukes én gang.</li>
                    </ul>
                `;
            }
            return `
                <ul class="snake-rules">
                    <li>Neste ord begynner med siste ledd: vann<b>flaske</b> → <b>flaske</b>hals.</li>
                    <li>Er siste ledd bøyd, kan du bruke formen som den står, eller grunnformen: stol<b>beina</b> → <b>bein</b>brudd.</li>
                    <li>Ordet må finnes i ordboka eller være satt sammen av ekte ord. Egennavn er ikke lov.</li>
                    <li>Hele ord kan bare brukes én gang, men deler av ord kan brukes om igjen.</li>
                </ul>
            `;
        }

        function renderSnakeSetup(challenge) {
            const saved = savedClassChain(challenge);
            const savedNext = saved ? saved.entries[saved.entries.length - 1].next.label : "";
            const record = snakeRecord(challenge);
            return `
                <section class="snake-setup" data-snake-fill>
                    <div class="snake-setup-intro work-panel">
                        <div class="snake-setup-title">
                            <h2>Ordslangen</h2>
                            <span class="snake-chip">${difficultyInfo().label} · ${escapeHtml(snakeVariantLabel(challenge))}</span>
                        </div>
                        ${snakeVariant() === "syllable" ? `
                            <div class="snake-rule-toggle" role="group" aria-label="Regel">
                                <button class="tab-button ${challenge.strict ? "" : "active"}" data-action="snake-rule" data-rule="vanlig" style="--active-color: #65a30d">
                                    <strong>Vanlig regel</strong>
                                    <span>Begynn med bokstavene i siste stavelse</span>
                                </button>
                                <button class="tab-button ${challenge.strict ? "active" : ""}" data-action="snake-rule" data-rule="streng" style="--active-color: #65a30d">
                                    <strong>Streng regel</strong>
                                    <span>Første stavelse må være helt lik</span>
                                </button>
                            </div>
                        ` : ""}
                        ${renderSnakeRules(challenge)}
                    </div>
                    <div class="snake-mode-grid">
                        <article class="snake-mode-card">
                            <div class="snake-mode-art" aria-hidden="true">
                                <span class="snake-mode-board">flaske<b>hals</b> → <b>hals</b>…</span>
                            </div>
                            <h3>Klassemodus</h3>
                            <p>For tavla. Send iPaden rundt, eller skriv ordet eleven sier. Slangen lagres, så dere kan fortsette der dere slapp neste gang.</p>
                            <div class="snake-mode-actions">
                                ${saved ? `
                                    <button class="primary-button" data-action="snake-start" data-mode="class" data-continue="1">Fortsett slangen: ${saved.entries.length} ord, neste ${escapeHtml(savedNext)}</button>
                                    <button class="secondary-button" data-action="snake-start" data-mode="class" data-continue="0">Start en ny slange</button>
                                ` : `
                                    <button class="primary-button" data-action="snake-start" data-mode="class" data-continue="0">Start klassemodus</button>
                                `}
                            </div>
                        </article>
                        <article class="snake-mode-card">
                            <div class="snake-mode-art" aria-hidden="true">
                                <span class="snake-mode-duel"><span>Du</span><span>Slangen</span></span>
                            </div>
                            <h3>Alene mot slangen</h3>
                            <p>Du og slangen bytter på å legge ord. Står du fast, kan du be om hjelp – men tenk selv først!</p>
                            <div class="snake-mode-actions">
                                <button class="primary-button" data-action="snake-start" data-mode="solo">Spill mot slangen</button>
                                ${record ? `<span class="snake-record">Rekord: ${record} ord</span>` : ""}
                            </div>
                        </article>
                    </div>
                </section>
            `;
        }

        function renderSnakePause(challenge) {
            const need = snakeNeed(challenge);
            return `
                <section class="snake-pause" data-snake-fill>
                    <p class="snake-pause-kicker">Neste gang fortsetter vi med</p>
                    <p class="snake-pause-word">${need.forms.map((form) => `<span>${escapeHtml(form)}-</span>`).join("<small>eller</small>")}</p>
                    <p class="snake-pause-meta">Slangen er ${challenge.entries.length} ord lang. Den er lagret på denne enheten.</p>
                    <div class="snake-pause-actions">
                        <button class="primary-button" data-action="snake-resume">Fortsett nå</button>
                        <button class="secondary-button" data-action="snake-setup">Tilbake</button>
                    </div>
                </section>
            `;
        }

        // Slangen bukter seg: hvert ord får en liten høyde- og vinkelforskyvning langs en bølge.
        const SNAKE_WAVE_STEP = 1.05;

        const SNAKE_WAVE_HEIGHT = 1.9;

        // widthEm: omtrentlig bredde på ordet, slik at helningen følger kurven uten å bli for bratt å lese.
        function snakeWave(position, widthEm = 5) {
            const angle = position * SNAKE_WAVE_STEP;
            const slope = (SNAKE_WAVE_HEIGHT * SNAKE_WAVE_STEP * Math.cos(angle)) / Math.max(3, widthEm);
            const degrees = Math.max(-12, Math.min(12, Math.atan(slope) * 180 / Math.PI));
            return {
                y: (Math.sin(angle) * SNAKE_WAVE_HEIGHT).toFixed(3),
                r: degrees.toFixed(2)
            };
        }

        function waveStyle(position, text = "") {
            const wave = snakeWave(position, String(text).length * 0.62 + 1.4);
            return `--wy: ${wave.y}em; --wr: ${wave.r}deg;`;
        }

        // Hvilke ordstarter som kan stå ferdig skrevet i hodet. Er den ene formen starten på den andre
        // (bein / beina), holder det med den korteste – eleven skriver bare videre.
        function snakePrefixOptions(challenge) {
            const forms = snakeNeed(challenge).forms || [];
            if (!forms.length) return [""];
            if (snakeVariant() === "syllable" && challenge.strict) return [forms[0]];
            const shortest = [...forms].sort((a, b) => a.length - b.length)[0];
            if (forms.every((form) => form.startsWith(shortest))) return [shortest];
            // Grunnformen først for sammensatte ord (tre før trærne), hovedstavelsen først for stavelser.
            return snakeVariant() === "compound" ? [...forms].reverse() : forms;
        }

        function snakePrefix(challenge) {
            const options = snakePrefixOptions(challenge);
            return options.includes(challenge.prefixChoice) ? challenge.prefixChoice : options[0];
        }

        // Ordet eleven har skrevet: ferdig utfylt start + resten. Har eleven skrevet hele ordet likevel, godtas det.
        function snakeTypedWord(challenge) {
            const prefix = snakePrefix(challenge);
            const typed = String(challenge.input || "").trim();
            const lower = typed.toLowerCase();
            const forms = snakeNeed(challenge).forms || [];
            if (prefix.length >= 2 && forms.some((form) => lower.startsWith(form) && lower.length > form.length + 1)) {
                return typed;
            }
            return prefix + typed;
        }

        function snakeInputWidth(value) {
            return `${Math.max(2.4, String(value || "").length + 0.9)}ch`;
        }

        function renderSnakeSegment(entry, index, isLast, syllableMode, animate) {
            const word = entry.word;
            const lastPart = entry.parts[entry.parts.length - 1] || "";
            const outStart = word.length - lastPart.length;
            const boundaries = new Set();
            let position = 0;
            entry.parts.slice(0, -1).forEach((part) => {
                position += part.length;
                boundaries.add(position);
            });

            const groups = [];
            [...word].forEach((ch, charIndex) => {
                const kind = charIndex < entry.linkIn ? "link-in" : (charIndex >= outStart ? "link-out" : "plain");
                if (boundaries.has(charIndex)) groups.push({ divider: true });
                const target = groups[groups.length - 1];
                if (target && !target.divider && target.kind === kind) {
                    target.text += ch;
                } else {
                    groups.push({ kind, text: ch });
                }
            });

            const inner = groups.map((group) => (group.divider
                ? `<span class="seg-divider ${syllableMode ? "dot" : ""}" aria-hidden="true">${syllableMode ? "·" : ""}</span>`
                : `<span class="seg-${group.kind}">${escapeHtml(group.text)}</span>`
            )).join("");

            const classes = [
                "snake-seg",
                `by-${entry.by}`,
                entry.unchecked ? "unchecked" : "",
                index % 2 ? "alt" : "",
                isLast ? "newest" : "",
                animate ? "pop" : ""
            ].filter(Boolean).join(" ");
            const label = entry.by === "slange" ? "Slangens ord" : (entry.by === "start" ? "Startord" : "Elevens ord");
            return `<button type="button" class="${classes}" data-action="snake-seg" data-index="${index}" data-snake-point aria-label="${escapeHtml(`${label}: ${word}`)}" style="${waveStyle(index, word)}">${inner}${entry.unchecked ? `<span class="seg-badge" title="Ikke sjekket i ordboka">?</span>` : ""}</button>`;
        }

        // Hodet på slangen: ordstarten står ferdig, eleven skriver resten rett inn i slangen.
        // Maten foran munnen: starten på neste ord står ferdig, eleven skriver resten.
        // Når ordet godkjennes, spiser slangen det, og ordet blir en ny del av kroppen.
        function renderSnakeFood(challenge) {
            const total = challenge.entries.length;
            const prefix = snakePrefix(challenge);
            const options = snakePrefixOptions(challenge);
            const feeding = challenge.feeding;
            const busy = challenge.checking || challenge.appThinking || Boolean(feeding);
            const won = challenge.phase === "won";
            const position = total + 1.25;
            if (feeding) {
                return `<span class="snake-food being-eaten ${feeding.by === "slange" ? "from-slange" : ""}" style="${waveStyle(position, feeding.word)}"><span class="food-word">${escapeHtml(feeding.word)}</span></span>`;
            }
            const classes = [
                "snake-food",
                busy ? "busy" : "",
                won ? "stuck" : "",
                challenge.shake ? "shake" : "",
                challenge.foodFresh ? "fresh" : ""
            ].filter(Boolean).join(" ");
            if (won) {
                return `<span class="${classes}" style="${waveStyle(position, prefix)}"><span class="head-prefix">${escapeHtml(prefix)}</span><span class="head-question">?</span></span>`;
            }
            const choices = options.length > 1 && !busy
                ? `
                    <span class="prefix-options" role="group" aria-label="Velg hvordan ordet begynner">
                        ${options.map((option) => `<button type="button" class="prefix-option ${option === prefix ? "active" : ""}" data-action="snake-prefix" data-prefix="${escapeHtml(option)}">${escapeHtml(option)}-</button>`).join("")}
                    </span>
                `
                : "";
            return `
                <form class="${classes}" data-snake-form autocomplete="off" style="${waveStyle(position, `${prefix}${challenge.input || ""}xx`)}">
                    ${choices}
                    <label class="head-prefix" for="snake-input">${escapeHtml(prefix)}</label>
                    ${challenge.appThinking
                        ? `<span class="head-thinking" aria-label="Slangen tenker"><i></i><i></i><i></i></span>`
                        : `<input id="snake-input" class="head-input" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send"
                            style="width: ${snakeInputWidth(challenge.input)}" aria-label="${escapeHtml(`Skriv resten av ordet etter ${prefix}`)}" placeholder="…" value="${escapeHtml(challenge.input)}" ${busy ? "disabled" : ""}>`}
                    <button class="head-submit" type="submit" aria-label="Gi ordet til slangen" title="Gi ordet til slangen" ${busy ? "disabled" : ""}>${challenge.checking ? "…" : "✓"}</button>
                </form>
            `;
        }

        function renderSnakeBoard(challenge) {
            const syllableMode = snakeVariant() === "syllable";
            const total = challenge.entries.length;
            return `
                <div class="snake-stage">
                    <div class="snake-lawn" data-snake-board>
                        <div class="snake-track" data-snake-track>
                            <svg class="snake-body" data-snake-body aria-hidden="true"></svg>
                            ${challenge.entries.map((entry, index) => renderSnakeSegment(entry, index, index === total - 1, syllableMode, challenge.justAdded === index)).join("")}
                            <span class="snake-head-space" data-snake-head aria-hidden="true" style="${waveStyle(total, "xxx")}"></span>
                            ${renderSnakeFood(challenge)}
                        </div>
                    </div>
                    <div class="snake-bubble ${challenge.phase === "won" ? "won" : ""}" aria-live="polite">${renderSnakeMessages(challenge)}</div>
                </div>
            `;
        }

        function renderSnakeMessages(challenge) {
            const message = (item) => `
                <div class="snake-message ${item.type}">
                    <strong>${escapeHtml(item.text)}</strong>
                    ${item.detail ? `<span>${escapeHtml(item.detail)}</span>` : ""}
                </div>
            `;
            if (challenge.phase === "won") {
                const need = snakeNeed(challenge);
                return `
                    <div class="snake-message success snake-result">
                        <strong>Du vant! 🎉</strong>
                        <span>Slangen kom ikke på noe ord som begynner på ${escapeHtml(need.forms.map((form) => `«${form}»`).join(" eller "))}. Slangen ble ${challenge.entries.length} ord lang${challenge.newRecord ? " – ny rekord!" : "."}</span>
                        <button class="primary-button" data-action="snake-new">Ny slange</button>
                    </div>
                `;
            }
            if (challenge.checking) {
                return message({ type: "info", text: "Sjekker i ordboka …" });
            }
            if (challenge.appThinking) {
                const first = challenge.messages[0];
                return `${first ? message(first) : ""}${message({ type: "info", text: "Slangen tenker …" })}`;
            }
            if (challenge.hint.loading) {
                return message({ type: "info", text: "Slangen leter etter et hint …" });
            }
            return challenge.messages.slice(0, 2).map(message).join("");
        }

        function renderSnakePlay(challenge) {
            const record = challenge.mode === "solo" ? snakeRecord(challenge) : 0;
            const classMode = challenge.mode === "class";
            const busy = challenge.checking || challenge.appThinking;
            return `
                <section class="snake-screen ${classMode ? "class-mode" : "solo-mode"}" data-snake-fill>
                    <div class="snake-bar">
                        <div class="snake-bar-title">
                            <h2>Ordslangen</h2>
                            <span class="snake-chip">${classMode ? "Klassemodus" : "Alene mot slangen"} · ${escapeHtml(snakeVariantLabel(challenge))}</span>
                        </div>
                        <div class="snake-stats">
                            <span class="snake-stat"><strong>${challenge.entries.length}</strong> ord</span>
                            ${record ? `<span class="snake-stat">Rekord <strong>${record}</strong></span>` : ""}
                            ${classMode ? "" : `<span class="snake-legend"><i class="legend-elev"></i>Du <i class="legend-slange"></i>Slangen</span>`}
                        </div>
                        <div class="snake-actions">
                            ${classMode ? "" : `<button class="secondary-button snake-help" data-action="snake-help" ${busy || challenge.phase !== "play" || challenge.hint.step >= 3 ? "disabled" : ""}>Jeg trenger hjelp${challenge.hint.step ? ` (${challenge.hint.step}/3)` : ""}</button>`}
                            ${classMode ? `<button class="secondary-button" data-action="snake-undo" ${challenge.entries.length <= 1 || busy ? "disabled" : ""}>Angre siste ord</button>` : ""}
                            ${classMode ? `<button class="secondary-button" data-action="snake-pause">Avslutt for i dag</button>` : ""}
                            <button class="secondary-button ${challenge.confirmNew ? "danger" : ""}" data-action="snake-new">${challenge.confirmNew ? "Sikker? Slangen slettes" : "Ny slange"}</button>
                            <button class="ghost-button" data-action="snake-setup">Regler</button>
                        </div>
                    </div>
                    ${renderSnakeBoard(challenge)}
                </section>
            `;
        }

        /* Kroppen tegnes som én myk, sammenhengende form gjennom midten av hvert ord,
           med en hale som smalner av og kveiler seg bakerst. */
        function sampleCurve(points, perSegment = 10) {
            const samples = [];
            for (let index = 0; index < points.length - 1; index += 1) {
                const p0 = points[index - 1] || points[index];
                const p1 = points[index];
                const p2 = points[index + 1];
                const p3 = points[index + 2] || p2;
                for (let step = 0; step < perSegment; step += 1) {
                    const t = step / perSegment;
                    const t2 = t * t;
                    const t3 = t2 * t;
                    const point = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
                    samples.push({ x: point(p0.x, p1.x, p2.x, p3.x), y: point(p0.y, p1.y, p2.y, p3.y) });
                }
            }
            samples.push({ ...points[points.length - 1] });
            return samples;
        }

        function tailCoil(start, width) {
            // En spiral fra halespissen og inn til første ord. Midtpunktet ligger rett over starten,
            // slik at halen glir vannrett over i kroppen. Radiusen er stor nok til at halen ikke overlapper seg selv.
            const radius = width * 1.15;
            const center = { x: start.x, y: start.y - radius };
            const points = [];
            const steps = 48;
            for (let step = steps; step >= 1; step -= 1) {
                const t = step / steps;
                const angle = Math.PI / 2 + t * Math.PI * 1.85;
                const r = radius * (1 - t * 0.68);
                points.push({ x: center.x + Math.cos(angle) * r, y: center.y + Math.sin(angle) * r, w: width * (1 - t * 0.85) });
            }
            return points;
        }

        function outline(centerline) {
            const left = [];
            const right = [];
            centerline.forEach((point, index) => {
                const before = centerline[Math.max(0, index - 1)];
                const after = centerline[Math.min(centerline.length - 1, index + 1)];
                const dx = after.x - before.x;
                const dy = after.y - before.y;
                const length = Math.hypot(dx, dy) || 1;
                const nx = -dy / length;
                const ny = dx / length;
                const half = point.w / 2;
                left.push(`${(point.x + nx * half).toFixed(1)},${(point.y + ny * half).toFixed(1)}`);
                right.push(`${(point.x - nx * half).toFixed(1)},${(point.y - ny * half).toFixed(1)}`);
            });
            // Avrundet ende ved hodet.
            const last = centerline[centerline.length - 1];
            const previous = centerline[centerline.length - 2] || last;
            const length = Math.hypot(last.x - previous.x, last.y - previous.y) || 1;
            const dx = (last.x - previous.x) / length;
            const dy = (last.y - previous.y) / length;
            const cap = [];
            for (let step = 1; step < 10; step += 1) {
                const angle = (step / 10) * Math.PI;
                const half = last.w / 2;
                cap.push(`${(last.x + (-dy * Math.cos(angle) + dx * Math.sin(angle)) * half).toFixed(1)},${(last.y + (dx * Math.cos(angle) + dy * Math.sin(angle)) * half).toFixed(1)}`);
            }
            return `M ${[...left, ...cap, ...right.reverse()].join(" L ")} Z`;
        }

        // Bredden på hodet langs kroppen (d = avstand fra midten av hodet, negativ bakover).
        function headWidth(d, width) {
            if (d <= -1.5 * width) return width;
            if (d <= -0.7 * width) return width * (1 - 0.12 * ((d + 1.5 * width) / (0.8 * width)));
            const t = Math.min(1, (d + 0.7 * width) / (1.25 * width));
            return width * (0.88 + 0.24 * Math.sin(Math.PI * t * 0.85));
        }

        function offsetLine(points, distance) {
            return points.map((point, index) => {
                const before = points[Math.max(0, index - 1)];
                const after = points[Math.min(points.length - 1, index + 1)];
                const dx = after.x - before.x;
                const dy = after.y - before.y;
                const length = Math.hypot(dx, dy) || 1;
                return `${(point.x - (dy / length) * distance).toFixed(1)},${(point.y + (dx / length) * distance).toFixed(1)}`;
            }).join(" L ");
        }

        let lastSnakeMouth = null;

        // Maten legges rett foran munnen, i samme retning som hodet peker.
        function placeSnakeFood() {
            const track = app.querySelector("[data-snake-track]");
            const food = track && track.querySelector(".snake-food");
            if (!food || !lastSnakeMouth) return;
            // Mål plasseringen uten animasjoner og flytting (offsetLeft/offsetTop er upåvirket av transform).
            const height = food.offsetHeight;
            const left = { x: food.offsetLeft, y: food.offsetTop + height / 2 };
            const { tip, dir } = lastSnakeMouth;
            const angle = Math.max(-14, Math.min(14, Math.atan2(dir.y, dir.x) * 180 / Math.PI));
            // Venstre kant av maten (litt inn) skal ligge ved tungespissen.
            const target = { x: tip.x + dir.x * height * 0.05, y: tip.y + dir.y * height * 0.05 };
            food.style.translate = `${(target.x - left.x).toFixed(1)}px ${(target.y - left.y).toFixed(1)}px`;
            food.style.rotate = `${angle.toFixed(1)}deg`;
            food.style.transformOrigin = "left center";
        }

        // Tegner slangen og legger maten foran munnen. Stikker maten utenfor, får brettet mer plass til høyre.
        function layoutSnake(gulp = false) {
            const track = app.querySelector("[data-snake-track]");
            if (!track) return;
            drawSnakeBody(gulp);
            placeSnakeFood();
            const food = track.querySelector(".snake-food");
            if (!food) return;
            const overflow = food.getBoundingClientRect().right - track.getBoundingClientRect().left + 24 - track.scrollWidth;
            if (overflow > 1) {
                track.style.paddingRight = `${(parseFloat(track.style.paddingRight) || 0) + overflow}px`;
                drawSnakeBody(gulp);
                placeSnakeFood();
            }
        }

        // Slangen sett ovenfra: hale, kropp og hode tegnes som én sammenhengende form,
        // så hodet vokser naturlig ut av kroppen.
        function drawSnakeBody(gulp = false) {
            const track = app.querySelector("[data-snake-track]");
            const svg = app.querySelector("[data-snake-body]");
            const headSpace = app.querySelector("[data-snake-head]");
            if (!track || !svg || !headSpace) return;
            const trackRect = track.getBoundingClientRect();
            const center = (rect) => ({
                x: rect.left - trackRect.left + rect.width / 2,
                y: rect.top - trackRect.top + rect.height / 2
            });
            const points = [...track.querySelectorAll("[data-snake-point]")];
            if (!points.length) return;
            const rects = points.map((element) => element.getBoundingClientRect());
            const centers = rects.map(center);
            const head = center(headSpace.getBoundingClientRect());
            // Bredden måles på ordene uten vipping, så kroppen sitter tett rundt dem.
            const width = Math.max(...points.map((element) => element.offsetHeight)) * 1.38;

            // Kroppen begynner ved venstre kant av første ord, der halen tar over.
            const first = rects[0];
            const start = { x: first.left - trackRect.left + points[0].offsetHeight * 0.4, y: centers[0].y };
            const body = sampleCurve([start, ...centers, head], 12);

            // Avstand bakover fra midten av hodet, for å forme nakke og hode.
            const distances = new Array(body.length).fill(0);
            for (let index = body.length - 2; index >= 0; index -= 1) {
                distances[index] = distances[index + 1] - Math.hypot(body[index + 1].x - body[index].x, body[index + 1].y - body[index].y);
            }
            const shaped = body.map((point, index) => ({ ...point, w: headWidth(distances[index], width) }));

            // Snuten: forleng kurven litt forbi midten av hodet.
            const previous = body[body.length - 2] || start;
            const length = Math.hypot(head.x - previous.x, head.y - previous.y) || 1;
            const dir = { x: (head.x - previous.x) / length, y: (head.y - previous.y) / length };
            const normal = { x: -dir.y, y: dir.x };
            const snout = 0.55 * width;
            for (let step = 1; step <= 10; step += 1) {
                const d = (step / 10) * snout;
                shaped.push({ x: head.x + dir.x * d, y: head.y + dir.y * d, w: headWidth(d, width) });
            }

            const tail = tailCoil(start, width);
            const shape = outline([...tail, ...shaped.slice(1)]);
            const scales = body.filter((point, index) => distances[index] < -1.6 * width);
            const at = (d, side) => ({
                x: head.x + dir.x * d + normal.x * side,
                y: head.y + dir.y * d + normal.y * side
            });
            const eyeSide = headWidth(0.05 * width, width) / 2 - 0.17 * width;
            const eyes = [-1, 1].map((sign) => {
                const eye = at(0.05 * width, sign * eyeSide);
                const pupil = at(0.1 * width, sign * eyeSide);
                return `
                    <circle cx="${eye.x.toFixed(1)}" cy="${eye.y.toFixed(1)}" r="${(width * 0.13).toFixed(1)}" fill="#fff" stroke="#2f4a0b" stroke-width="${(width * 0.025).toFixed(1)}"/>
                    <circle cx="${pupil.x.toFixed(1)}" cy="${pupil.y.toFixed(1)}" r="${(width * 0.07).toFixed(1)}" fill="#111827"/>
                    <circle cx="${(pupil.x + width * 0.025).toFixed(1)}" cy="${(pupil.y - width * 0.025).toFixed(1)}" r="${(width * 0.022).toFixed(1)}" fill="#fff"/>
                `;
            }).join("");
            const front = snout + headWidth(snout, width) / 2;
            const nostrils = [-1, 1].map((sign) => {
                const nostril = at(front - 0.16 * width, sign * 0.12 * width);
                return `<circle cx="${nostril.x.toFixed(1)}" cy="${nostril.y.toFixed(1)}" r="${(width * 0.03).toFixed(1)}" fill="#1a2e05"/>`;
            }).join("");
            const tip = at(front, 0);
            const fork = at(front + 0.3 * width, 0);
            const prongA = at(front + 0.42 * width, 0.1 * width);
            const prongB = at(front + 0.42 * width, -0.1 * width);
            lastSnakeMouth = { tip: at(front + 0.36 * width, 0), dir };
            const p = (point) => `${point.x.toFixed(1)} ${point.y.toFixed(1)}`;

            const trackWidth = track.scrollWidth;
            const trackHeight = track.scrollHeight;
            svg.setAttribute("width", trackWidth);
            svg.setAttribute("height", trackHeight);
            svg.setAttribute("viewBox", `0 0 ${trackWidth} ${trackHeight}`);
            svg.innerHTML = `
                <path d="${shape}" fill="rgba(20, 50, 10, 0.28)" transform="translate(${(width * 0.06).toFixed(1)} ${(width * 0.16).toFixed(1)})"/>
                <path class="snake-tongue-path" d="M ${p(tip)} L ${p(fork)} L ${p(prongA)} M ${p(fork)} L ${p(prongB)}" fill="none" stroke="#e11d48" stroke-width="${(width * 0.07).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="${shape}" fill="#4d7c0f" stroke="#2f4a0b" stroke-width="${Math.max(2, width * 0.06).toFixed(1)}" stroke-linejoin="round"/>
                ${scales.length > 1 ? `
                    <path d="M ${offsetLine(scales, -0.3 * width)}" fill="none" stroke="#84cc16" stroke-opacity="0.6" stroke-width="${(width * 0.13).toFixed(1)}" stroke-linecap="round" stroke-dasharray="${(width * 0.1).toFixed(1)} ${(width * 0.36).toFixed(1)}"/>
                    <path d="M ${offsetLine(scales, 0.3 * width)}" fill="none" stroke="#365314" stroke-opacity="0.35" stroke-width="${(width * 0.12).toFixed(1)}" stroke-linecap="round" stroke-dasharray="${(width * 0.1).toFixed(1)} ${(width * 0.36).toFixed(1)}" stroke-dashoffset="${(width * 0.23).toFixed(1)}"/>
                ` : ""}
                <g class="snake-face ${gulp ? "gulp" : ""}">
                    ${eyes}
                    ${nostrils}
                </g>
            `;
        }

        function snakeScrollToHead(board, smooth) {
            const max = board.scrollWidth - board.clientWidth;
            if (smooth && typeof board.scrollTo === "function") {
                board.scrollTo({ left: max, behavior: "smooth" });
            } else {
                board.scrollLeft = max;
            }
        }

        // Bruk all tilgjengelig plass: spillflaten fyller skjermhøyden, og ordene blir så store som høyden tillater.
        function afterSnakeRender() {
            const challenge = state.challenge;
            const fill = app.querySelector("[data-snake-fill]");
            if (!fill) return;
            const bottomGap = window.innerWidth <= 900 ? 12 : 18;
            const top = fill.getBoundingClientRect().top + window.scrollY;
            const available = Math.floor(window.innerHeight - top - bottomGap);
            if (fill.classList.contains("snake-screen")) {
                fill.style.height = `${Math.max(420, available)}px`;
            } else {
                fill.style.minHeight = `${Math.max(360, available)}px`;
            }

            const board = fill.querySelector("[data-snake-board]");
            const track = fill.querySelector("[data-snake-track]");
            if (!board || !track || !challenge) return;
            const font = Math.max(16, Math.min(60, board.clientHeight * 0.065, board.clientWidth * 0.05));
            track.style.setProperty("--seg-font", `${font.toFixed(1)}px`);
            // Hodet står litt til høyre på skjermen; slangen strekker seg mot venstre.
            track.style.paddingRight = `${Math.round(board.clientWidth * 0.16)}px`;
            const grew = challenge.justAdded !== null && challenge.justAdded !== undefined;
            layoutSnake(grew);
            if (grew || challenge.scrollToHead || typeof challenge.savedScroll !== "number") {
                if (grew && typeof challenge.savedScroll === "number") board.scrollLeft = challenge.savedScroll;
                snakeScrollToHead(board, grew);
            } else {
                board.scrollLeft = challenge.savedScroll;
            }
            challenge.justAdded = null;
            challenge.scrollToHead = false;
            challenge.shake = false;
            challenge.foodFresh = false;
            board.dataset.ready = "1";

            if (challenge.phase === "play" && !challenge.checking && !challenge.appThinking
                && window.matchMedia("(pointer: fine)").matches) {
                const input = document.getElementById("snake-input");
                if (input && document.activeElement !== input) input.focus({ preventScroll: true });
            }
        }

        window.addEventListener("resize", () => {
            if (state.view === "ordslangen") window.requestAnimationFrame(afterSnakeRender);
        });

        // Musehjul ruller slangen sidelengs.
        app.addEventListener("wheel", (event) => {
            const board = event.target.closest && event.target.closest("[data-snake-board]");
            if (!board || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
            board.scrollLeft += event.deltaY;
            event.preventDefault();
        }, { passive: false });

        loadProgress();
        render();
    </script>
</body>
</html>
